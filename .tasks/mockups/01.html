<!-- 01 Pocket Grid. Reach views via the nav (bottom bar under 1024px, top bar from 1024px) or hashes: #/ home · #/cards grid (#/cards?q=zzz = empty state; Filters button / Type-Rarity-Set chips open the sheet/popover) · #/card/sm11-56 detail (tabs are buttons, or #/card/sm11-56?tab=attacks|weaknesses|legalities) -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Grid</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  [hidden]{display:none!important}
  .noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
  .chip{@apply shrink-0 h-8 px-3 rounded-full border border-zinc-800 bg-zinc-900 text-sm text-zinc-200 inline-flex items-center gap-1.5 whitespace-nowrap hover:border-zinc-600}
  [data-nav].on{@apply text-white}
  [data-nav].on .bar{@apply opacity-100}
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased pb-20 lg:pb-0">

<!-- Laptop: compact top bar, tabs inline, search centred -->
<header class="hidden lg:block sticky top-0 z-30 bg-zinc-950/90 backdrop-blur border-b border-zinc-800/80">
  <div class="h-14 px-6 grid grid-cols-[1fr_minmax(0,480px)_1fr] items-center gap-6">
    <div class="flex items-center gap-8">
      <a href="#/" class="font-black tracking-tight text-lg">Ash<span class="text-yellow-300">.</span>cards</a>
      <nav class="flex gap-6 text-sm font-medium text-zinc-400">
        <a data-nav="home" href="#/" class="relative py-4 hover:text-white">Home<span class="bar absolute inset-x-0 bottom-0 h-0.5 bg-yellow-300 opacity-0"></span></a>
        <a data-nav="cards" href="#/cards" class="relative py-4 hover:text-white">Cards<span class="bar absolute inset-x-0 bottom-0 h-0.5 bg-yellow-300 opacity-0"></span></a>
      </nav>
    </div>
    <label class="relative block">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input data-q type="search" oninput="setQ(this.value)" placeholder="Search 2,138 cards by name" class="w-full h-9 rounded-full bg-zinc-900 border border-zinc-800 pl-9 pr-3 text-sm placeholder-zinc-500 focus:outline-none focus:border-zinc-500">
    </label>
    <div class="text-right text-xs text-zinc-500 tabular-nums">2,138 cards · 121 sets</div>
  </div>
</header>

<main>
  <!-- (a) HOME -->
  <section id="v-home" class="view max-w-[1280px] mx-auto">
    <div class="px-4 lg:px-6 pt-8 lg:pt-12">
      <p class="text-[11px] uppercase tracking-[.22em] text-zinc-500">Ash's collection</p>
      <h1 class="mt-1 text-3xl lg:text-5xl font-black tracking-tight">2,138 cards<span class="text-zinc-600"> · 121 sets</span></h1>
      <form onsubmit="event.preventDefault();location.hash='#/cards?q='+encodeURIComponent(this.s.value)" class="mt-6 lg:max-w-xl">
        <label class="relative block">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input name="s" type="search" placeholder="Quick search by name" class="w-full h-12 rounded-2xl bg-zinc-900 border border-zinc-800 pl-12 pr-4 placeholder-zinc-500 focus:outline-none focus:border-zinc-500">
        </label>
      </form>
      <div class="mt-3 -mx-4 px-4 lg:mx-0 lg:px-0 flex items-center gap-2 overflow-x-auto noscroll">
        <span class="shrink-0 text-xs text-zinc-500 pr-1">Recent</span>
        <a class="chip" href="#/cards?q=Pikachu">Pikachu</a>
        <a class="chip" href="#/cards?q=Snorlax">Snorlax</a>
        <a class="chip" href="#/cards?q=Eevee">Eevee</a>
        <a class="chip" href="#/cards?q=Drifloon">Drifloon</a>
        <a class="chip" href="#/cards?q=Riolu">Riolu</a>
        <a class="chip" href="#/cards?q=Morpeko">Morpeko</a>
        <button class="shrink-0 text-xs text-zinc-500 underline underline-offset-2 pl-1">Clear</button>
      </div>
    </div>

    <div class="mt-10">
      <h2 class="px-4 lg:px-6 flex items-baseline justify-between"><span class="text-lg font-bold">Favourites</span><span id="fav-n" class="text-xs text-zinc-500"></span></h2>
      <div id="fav-row" class="mt-3 flex gap-3 overflow-x-auto noscroll snap-x px-4 lg:px-6"></div>
    </div>

    <div class="mt-8">
      <h2 class="px-4 lg:px-6 text-lg font-bold">Recently viewed</h2>
      <div id="seen-row" class="mt-3 flex gap-2.5 overflow-x-auto noscroll snap-x px-4 lg:px-6"></div>
    </div>

    <div class="mt-10 px-4 lg:px-6 pb-12">
      <h2 class="text-lg font-bold">Browse</h2>
      <div class="mt-4 grid gap-8 lg:grid-cols-3 lg:gap-10">
        <div>
          <h3 class="flex justify-between text-sm"><span class="font-semibold">Types</span><span class="text-zinc-500 tabular-nums">11</span></h3>
          <div id="b-type" class="mt-3 grid grid-cols-2 gap-1.5"></div>
        </div>
        <div>
          <h3 class="flex justify-between text-sm"><span class="font-semibold">Rarities</span><span class="text-zinc-500 tabular-nums">8</span></h3>
          <div id="b-rarity" class="mt-3 rounded-xl bg-zinc-900 divide-y divide-zinc-800"></div>
        </div>
        <div>
          <h3 class="flex justify-between text-sm"><span class="font-semibold">Sets</span><span class="text-zinc-500 tabular-nums">121</span></h3>
          <div id="b-set" class="mt-3 grid grid-cols-4 gap-1.5"></div>
          <a href="#/cards?panel=set" class="mt-3 inline-block text-sm text-zinc-400 underline underline-offset-4 hover:text-white">All 121 sets</a>
        </div>
      </div>
    </div>
  </section>

  <!-- (b) GRID /cards -->
  <section id="v-cards" class="view" hidden>
    <div class="sticky top-0 lg:top-14 z-40 bg-zinc-950 border-b border-zinc-900">
      <div class="lg:hidden flex gap-2 px-3 pt-3">
        <label class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" data-q type="search" oninput="setQ(this.value)" placeholder="Search 2,138 cards" class="w-full h-10 rounded-xl bg-zinc-900 border border-zinc-800 pl-9 pr-3 text-sm placeholder-zinc-500 focus:outline-none focus:border-zinc-500">
        </label>
        <button onclick="openPanel('type',this)" aria-label="Filters" class="relative h-10 w-10 grid place-items-center rounded-xl bg-zinc-900 border border-zinc-800">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span id="fbadge" class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-yellow-300 text-zinc-950 text-[11px] font-bold grid place-items-center"></span>
        </button>
      </div>
      <div class="relative">
        <div class="flex items-center gap-2 px-3 lg:px-6 py-3 overflow-x-auto lg:overflow-visible lg:flex-wrap noscroll">
          <button data-sec="type" onclick="openPanel('type',this)" class="chip">Type<i class="not-italic text-yellow-300"></i><svg class="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></button>
          <button data-sec="rarity" onclick="openPanel('rarity',this)" class="chip">Rarity<i class="not-italic text-yellow-300"></i><svg class="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></button>
          <button data-sec="set" onclick="openPanel('set',this)" class="chip">Set<i class="not-italic text-yellow-300"></i><svg class="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></button>
          <span class="shrink-0 w-px h-5 bg-zinc-800 mx-1"></span>
          <div id="active" class="contents"></div>
        </div>
        <!-- Filters: bottom sheet on phone, popover under the chip row on laptop -->
        <div id="scrim" hidden onclick="closePanel()" class="fixed inset-0 bg-black/60 lg:bg-transparent"></div>
        <div id="panel" hidden role="dialog" aria-label="Filters" class="fixed inset-x-0 bottom-0 z-10 max-h-[78vh] flex flex-col rounded-t-3xl bg-zinc-900 border-t border-zinc-800 lg:absolute lg:bottom-auto lg:right-auto lg:top-full lg:-mt-1 lg:w-[400px] lg:max-h-[460px] lg:rounded-2xl lg:border lg:shadow-2xl lg:shadow-black">
          <div class="lg:hidden mx-auto mt-2.5 h-1 w-10 rounded-full bg-zinc-700"></div>
          <div class="flex items-center justify-between px-5 py-3">
            <b><span class="lg:hidden">Filters</span><span id="ptitle" class="hidden lg:inline"></span></b>
            <button onclick="closePanel()" aria-label="Close" class="w-8 h-8 grid place-items-center rounded-full text-zinc-400 hover:bg-zinc-800">✕</button>
          </div>
          <div class="flex min-h-0 flex-1 border-t border-zinc-800">
            <div id="rail" class="lg:hidden w-28 shrink-0 py-2 bg-zinc-950/50"></div>
            <div id="opts" class="flex-1 overflow-y-auto p-4 flex flex-wrap content-start gap-2"></div>
          </div>
          <div class="flex gap-3 p-4 border-t border-zinc-800" style="padding-bottom:max(1rem,env(safe-area-inset-bottom))">
            <button onclick="resetDraft()" class="flex-1 h-11 rounded-xl border border-zinc-700 text-sm font-medium">Reset</button>
            <button id="show" onclick="apply()" class="flex-[2] h-11 rounded-xl bg-yellow-300 text-zinc-950 text-sm font-bold"></button>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between px-3 lg:px-6 pb-2.5 text-xs text-zinc-400">
        <span id="count"></span>
        <button id="clear" onclick="clearAll()" class="underline underline-offset-2 hover:text-white">Clear all</button>
      </div>
    </div>
    <div id="grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7"></div>
    <div id="empty" hidden class="px-6 py-24 text-center">
      <svg class="mx-auto w-14 h-14 text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h6m6 0h6"/><circle cx="12" cy="12" r="3"/></svg>
      <p class="mt-4 text-lg font-bold">No cards match</p>
      <p class="mt-1 text-sm text-zinc-500">Try another name or remove a filter.</p>
      <button onclick="clearAll()" class="mt-6 h-10 px-5 rounded-full bg-zinc-100 text-zinc-950 text-sm font-semibold">Clear search and filters</button>
    </div>
  </section>

  <!-- (c) DETAIL /card/:id (filled by script) -->
  <section id="v-detail" class="view" hidden></section>
</main>

  <a data-nav="home" href="#/" class="flex flex-col items-center gap-1 pt-2.5 pb-2">

</nav>

const SETS=[['xy1',49],['sm1',46],['gym2',46],['g1',46],['swsh8',45],['dp1',44],['col1',43],['hgss1',39]];
const OPTS={type:TYPES,rarity:RAR,set:SETS}, LABEL={type:'Type',rarity:'Rarity',set:'Set'};
const HP='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z';
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,ch=>'&#'+ch.charCodeAt(0)+';');
const img=(c,big)=>`https://images.pokemontcg.io/${c.id.replace('-','/')}${big?'_hires':''}.png`;
const setOf=c=>c.id.split('-')[0];
const byId=id=>C.find(c=>c.id===id);
const copy=f=>({type:new Set(f.type),rarity:new Set(f.rarity),set:new Set(f.set)});
const NONE={type:[],rarity:[],set:[]};

let favs=new Set(['sm11-56','pl2-81','bw5-84','swsh10tg-TG08','dp7-SH1']);
let seen=['swsh8-179','xy1-52','bw7-5','ex14-16','swsh4-90','swsh45-7'];
let q='', F=copy(NONE), draft=copy(NONE), sec='type', view='home', cur='', tab='attacks';
const match=(c,f)=>(!q||c.name.toLowerCase().includes(q.toLowerCase()))
  &&(!f.type.size||c.types.some(t=>f.type.has(t)))&&(!f.rarity.size||f.rarity.has(c.rarity))&&(!f.set.size||f.set.has(setOf(c)));

const dot=t=>`<span title="${t}" class="inline-block w-3.5 h-3.5 rounded-full ring-1 ring-black/40 shrink-0" style="background:${TYPE[t]}"></span>`;
const heart=(id,cls)=>{const on=favs.has(id);return `<button onclick="fav('${id}')" aria-label="${on?'Remove from':'Add to'} favourites" aria-pressed="${on}" class="grid place-items-center rounded-full ${cls} ${on?'text-rose-500':'text-white/90 hover:text-white'}"><svg viewBox="0 0 24 24" class="w-[55%] h-[55%]" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="${HP}"/></svg></button>`};
const tile=(c,w='')=>`<div class="relative ${w}" style="background:linear-gradient(135deg,${TYPE[c.types[0]]} 70%,${TYPE[c.types[0]]}88)">
  <a href="#/card/${c.id}" class="block p-[3px] focus:outline-none focus-visible:ring-2 focus-visible:ring-white"><img src="${img(c)}" alt="${c.name}" loading="lazy" class="block w-full aspect-[245/342] object-cover bg-zinc-900"></a>
  ${heart(c.id,'absolute top-1.5 right-1.5 w-7 h-7 bg-black/55 backdrop-blur')}</div>`;

function route(){
  const [path,qs]=(location.hash.slice(1)||'/').split('?'), p=new URLSearchParams(qs);
  view=path.startsWith('/card/')?'detail':path==='/cards'?'cards':'home';
  if(view==='detail'){cur=decodeURIComponent(path.slice(6));tab=p.get('tab')||'attacks';seen=[cur,...seen.filter(i=>i!==cur)].slice(0,10);}
  if(p.has('q')) setQ(p.get('q'),1);
  if(['type','rarity','set'].some(k=>p.has(k))){F=copy(NONE);['type','rarity','set'].forEach(k=>p.has(k)&&F[k].add(p.get(k)));}
  closePanel(); render(); scrollTo(0,0);
  if(view==='cards'&&OPTS[p.get('panel')]) openPanel(p.get('panel'),$(`[data-sec=${p.get('panel')}]`));
}
function render(){
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+view);
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(view==='detail'?'cards':view)));
  ({home:renderHome,cards:renderGrid,detail:renderDetail})[view]();
}
function setQ(v,silent){q=v;document.querySelectorAll('[data-q]').forEach(i=>i.value=v);if(silent)return;view==='cards'?renderGrid():location.hash='#/cards';}
function searchTab(){location.hash='#/cards';view='cards';render();$('#q').focus();}
function fav(id){favs.has(id)?favs.delete(id):favs.add(id);render();}

function renderHome(){
  const f=C.filter(c=>favs.has(c.id));
  $('#fav-n').textContent=f.length+' pinned';
  $('#fav-row').innerHTML=f.length?f.map(c=>tile(c,'shrink-0 w-28 lg:w-40 rounded-lg overflow-hidden snap-start')).join('')
    :'<p class="py-6 text-sm text-zinc-500">Tap the heart on any card to pin it here.</p>';
  $('#seen-row').innerHTML=seen.map(id=>tile(byId(id),'shrink-0 w-20 lg:w-28 rounded-md overflow-hidden snap-start')).join('');
  $('#b-type').innerHTML=TYPES.map(([t,n])=>`<a href="#/cards?type=${t}" class="flex items-center gap-2 h-10 px-3 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-sm">${dot(t)}${t}<span class="ml-auto text-xs text-zinc-500 tabular-nums">${n}</span></a>`).join('');
  $('#b-rarity').innerHTML=RAR.map(([r,n])=>`<a href="#/cards?rarity=${encodeURIComponent(r)}" class="flex items-center h-10 px-3 text-sm hover:bg-zinc-800 first:rounded-t-xl last:rounded-b-xl">${r}<span class="ml-auto text-xs text-zinc-500 tabular-nums">${n}</span></a>`).join('');
  $('#b-set').innerHTML=SETS.map(([s,n])=>`<a href="#/cards?set=${s}" class="rounded-lg bg-zinc-900 hover:bg-zinc-800 px-2.5 py-2"><div class="font-mono text-sm">${s}</div><div class="text-[11px] text-zinc-500 tabular-nums">${n}</div></a>`).join('');
}

function renderGrid(){
  const r=C.filter(c=>match(c,F)), n=F.type.size+F.rarity.size+F.set.size;
  $('#grid').innerHTML=r.map(c=>tile(c)).join('');
  $('#grid').hidden=!r.length; $('#empty').hidden=!!r.length;
  $('#count').innerHTML=`<b class="text-zinc-100 tabular-nums">${r.length}</b> cards${q?` matching “${esc(q)}”`:''}`;
  $('#active').innerHTML=Object.entries(F).flatMap(([k,s])=>[...s].map(v=>`<button onclick="rm('${k}','${v}')" aria-label="Remove ${v}" class="chip !bg-zinc-100 !text-zinc-900 !border-zinc-100">${k==='type'?dot(v):''}<span class="${k==='set'?'font-mono':''}">${v}</span><span aria-hidden="true" class="text-zinc-500">✕</span></button>`)).join('');
  $('#clear').hidden=!(n||q);
  $('#fbadge').textContent=n; $('#fbadge').hidden=!n;
  document.querySelectorAll('[data-sec]').forEach(b=>b.querySelector('i').textContent=F[b.dataset.sec].size?' · '+F[b.dataset.sec].size:'');
}

function openPanel(s,el){
  draft=copy(F); sec=s;
  $('#panel').style.left=matchMedia('(min-width:1024px)').matches&&el?el.offsetLeft+'px':'';
  $('#panel').hidden=$('#scrim').hidden=false; renderPanel();
}
function closePanel(){$('#panel').hidden=$('#scrim').hidden=true;}
function renderPanel(){
  $('#ptitle').textContent=LABEL[sec];
  $('#rail').innerHTML=Object.keys(OPTS).map(k=>`<button onclick="sec='${k}';renderPanel()" class="flex w-full items-center justify-between h-12 px-4 text-sm text-left border-l-2 ${k===sec?'bg-zinc-900 text-white border-yellow-300 font-semibold':'text-zinc-400 border-transparent'}">${LABEL[k]}${draft[k].size?`<span class="text-xs text-yellow-300">${draft[k].size}</span>`:''}</button>`).join('');
  $('#opts').innerHTML=OPTS[sec].map(([v,n])=>{const on=draft[sec].has(v);return `<button onclick="tog('${v}')" aria-pressed="${on}" class="chip ${on?'!bg-yellow-300 !text-zinc-950 !border-yellow-300':''}">${sec==='type'?dot(v):''}<span class="${sec==='set'?'font-mono':''}">${v}</span><span class="text-xs opacity-60 tabular-nums">${n}</span></button>`}).join('')
    +(sec==='set'?'<p class="w-full pt-2 text-xs text-zinc-500">Mockup lists the 8 largest of 121 sets.</p>':'');
  $('#show').textContent=`Show ${C.filter(c=>match(c,draft)).length} results`;
}
function tog(v){const s=draft[sec];s.has(v)?s.delete(v):s.add(v);renderPanel();}
function resetDraft(){draft=copy(NONE);renderPanel();}
function apply(){F=draft;closePanel();renderGrid();}
function rm(k,v){F[k].delete(v);renderGrid();}
function clearAll(){F=copy(NONE);setQ('',1);renderGrid();}

const row=(a,b)=>`<div class="flex items-center gap-3 py-3.5 border-b border-zinc-800/70">${a}<span class="ml-auto">${b}</span></div>`;
const PANES={
  attacks:c=>c.attacks.map(a=>`<div class="py-4 border-b border-zinc-800/70">
    <div class="flex items-center gap-3"><span class="flex gap-1">${a.cost.map(dot).join('')}</span><span class="font-semibold">${a.name}</span><span class="ml-auto text-2xl font-black tabular-nums">${a.damage}</span></div>
    ${a.text?`<p class="mt-1.5 text-sm text-zinc-400 leading-relaxed">${a.text}</p>`:''}</div>`).join(''),
  weaknesses:c=>(c.weaknesses||[]).map(w=>row(`${dot(w.type)}<span>${w.type}</span>`,`<b class="text-xl font-black tabular-nums">${w.value}</b>`)).join('')||'<p class="py-4 text-sm text-zinc-500">No weaknesses.</p>',
  legalities:c=>['unlimited','expanded','standard'].map(k=>{const v=c.legalities[k];return row(`<span class="capitalize">${k}</span>`,
    v==='Legal'?`<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-400/15 text-emerald-300">Legal</span>`
    :`<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-zinc-800 text-zinc-400">${v||'Not legal'}</span>`)}).join('')
};
function renderDetail(){
  const c=byId(cur)||C[0], col=TYPE[c.types[0]];
  $('#v-detail').innerHTML=`<div class="lg:max-w-6xl lg:mx-auto lg:px-6 lg:py-10 lg:grid lg:grid-cols-[420px_1fr] lg:gap-14 lg:items-start">
    <div class="relative lg:sticky lg:top-24 overflow-hidden lg:rounded-3xl px-12 pt-16 pb-8 lg:p-10" style="background:radial-gradient(120% 85% at 50% 0%,${col}d0,${col}30 60%,#09090b)">
      <a href="#/cards" class="absolute top-3 left-3 h-9 pl-2 pr-3 inline-flex items-center gap-1 rounded-full bg-black/50 backdrop-blur text-sm"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Cards</a>
      <img src="${img(c,1)}" alt="${c.name}" class="mx-auto w-full max-w-[300px] rounded-[4.5%/3.2%] shadow-2xl shadow-black/70">
    </div>
    <div class="px-4 lg:px-0 pt-5 lg:pt-2">
      <div class="flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <p class="text-[11px] uppercase tracking-[.18em] text-zinc-500"><span class="font-mono normal-case text-zinc-300">${setOf(c)}</span> · #${c.number} · ${c.rarity}</p>
          <h1 class="mt-1 text-3xl lg:text-5xl font-black tracking-tight">${c.name}</h1>
          <p class="mt-3 flex flex-wrap items-center gap-2 text-sm text-zinc-300">${c.types.map(t=>`<span class="h-6 px-2.5 inline-flex items-center rounded-full text-xs font-bold text-zinc-950" style="background:${TYPE[t]}">${t}</span>`).join('')}<span>HP <b>${c.hp}</b></span><span class="text-zinc-600">·</span><span>${c.subtypes.join(', ')}</span></p>
        </div>
        ${heart(c.id,'shrink-0 w-11 h-11 bg-zinc-900 border border-zinc-800')}
      </div>
      ${c.flavorText?`<p class="mt-4 text-sm text-zinc-400 leading-relaxed lg:max-w-xl">${c.flavorText}</p>`:''}
      <div role="tablist" class="mt-6 flex gap-7 border-b border-zinc-800 overflow-x-auto noscroll">${Object.keys(PANES).map(t=>`<button role="tab" aria-selected="${t===tab}" onclick="tab='${t}';renderDetail()" class="pb-3 -mb-px border-b-2 text-sm font-semibold capitalize ${t===tab?'text-white':'border-transparent text-zinc-500 hover:text-zinc-300'}" ${t===tab?`style="border-color:${col}"`:''}>${t}</button>`).join('')}</div>
      <div role="tabpanel" class="pb-4 lg:max-w-xl">${PANES[tab](c)}</div>
      <p class="pb-10 text-xs text-zinc-600">Illus. ${c.artist}</p>
    </div></div>`;
}

addEventListener('hashchange',route);
addEventListener('keydown',e=>e.key==='Escape'&&closePanel());
route();
</script>
</body>
</html>
